name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -project Vaultline.xcodeproj -scheme Vaultline -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1 || (tail -n 100 build.log; exit 1)
      - name: Package IPA
        run: mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Vaultline.app Payload/ && zip -qr Vaultline.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vaultline-ipa
          path: Vaultline.ipa
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
